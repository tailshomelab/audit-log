name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["26"]

    name: Node ${{ matrix.node-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Check package exports
        run: pnpm run test:exports

      - name: Type-check fixtures
        run: pnpm exec tsc --noEmit -p tsconfig.fixtures.json

      - name: Run tests
        run: pnpm test

  bun-smoke:
    runs-on: ubuntu-latest

    name: Bun smoke (MikroORM + libSQL)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Bun smoke test
        run: bun --version && bun scripts/bun-smoke.mjs
